[package]
name = "bitcoiin"
version = "0.1.0"
edition = "2021"

[dependencies]
dialoguer = { version = "0.11.0", features = ["history", "completion"]}
hex = "0.4.3"
owo-colors = { version = "4.1.0", features = ["supports-color", "supports-colors"] }
rand = "0.9.0"
reqwest = { version = "0.12.12", features = ["blocking", "native-tls-vendored"] }
serde = { version = "1.0.217", features = ["derive"]}
serde_json = "1.0.138"
serde_with = { version = "3.12.0", features = ["hex", "json"] }
sha2 = "0.10.8"

[[bin]]
name="bitcoiin-server"
path="src/server.rs"

[[bin]]
name="bitcoiin-client"
path="src/client.rs"
# target="powerpc-unknown-linux-gnu"
